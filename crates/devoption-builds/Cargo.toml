[package]
name = "devoption-builds"
description = "Immutable build-plan metadata and structural validation, without execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
devoption-projects = { path = "../devoption-projects" }
devoption-registry = { path = "../devoption-registry" }
sha2 = { version = "=0.11.1", default-features = false }
sha1collisiondetection = { version = "=0.3.4", default-features = false }

[target.'cfg(unix)'.dependencies]
getrandom = { version = "=0.4.3", default-features = false }
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(unix)'.dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[package]
name = "devoption-server"
description = "Local HTTP service, authentication, and owner storage for DevOption"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
devoption-ui = { path = "../devoption-ui" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
http-body = { version = "=1.1.0", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["test-util"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[target.'cfg(unix)'.dependencies]
getrandom = { version = "=0.4.3", default-features = false }
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(unix)'.dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

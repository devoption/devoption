[package]
name = "devoption-cli"
description = "The DevOption command line and local development server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
devoption-ui = { path = "../devoption-ui" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
subtle = { version = "=2.6.1", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["net", "rt"] }

[dev-dependencies]
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(unix)'.dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "devoption"
path = "src/main.rs"

[lints]
workspace = true

[package]
name = "devoption-cli"
description = "The DevOption command line and local development server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
devoption-ui = { path = "../devoption-ui" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
subtle = { version = "=2.6.1", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["net", "rt"] }

[[bin]]
name = "devoption"
path = "src/main.rs"

[lints]
workspace = true

[workspace]
members = ["crates/devoption-runtime", "crates/devoption-builds", "crates/devoption-cli", "crates/devoption-projects", "crates/devoption-registry", "crates/devoption-server", "crates/devoption-ui"]
exclude = ["examples/web-app"]
resolver = "3"

[workspace.package]
version = "0.1.0-preview.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/devoption/devoption"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

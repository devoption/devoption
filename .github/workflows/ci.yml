name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Rust formatting and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup show active-toolchain
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: git diff --exit-code

  tests:
    name: Rust tests and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup show active-toolchain
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked --offline
      - name: Build trusted fixture from verified local registry seed
        run: cargo test -p devoption-registry --test offline_build --locked --offline -- --ignored --nocapture
      - run: cargo build --workspace --locked --offline
      - run: git diff --exit-code

  installation:
    name: Release build and installation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup show active-toolchain
      - run: cargo fetch --locked
      - name: Check private source-install fixtures
        run: |
          cargo build --workspace --release --locked --offline
          cargo test -p devoption-cli --test server --release --locked --offline installation
          python3 scripts/check_systemd_unit.py target/release/devoption
      - name: Verify ordinary and protected HTTPS access through the pinned proxy
        env:
          DEVOPTION_TEST_CADDY: ${{ runner.temp }}/devoption-proxy-test/caddy
        run: |
          python3 - <<'PYTHON'
          import hashlib, io, os, sys, tarfile, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from release_bundle import CADDY_SHA512, CADDY_VERSION
          url = f'https://github.com/caddyserver/caddy/releases/download/v{CADDY_VERSION}/caddy_{CADDY_VERSION}_linux_amd64.tar.gz'
          with urllib.request.urlopen(url, timeout=30) as response:
              raw = response.read(256 * 1024 * 1024 + 1)
          if hashlib.sha512(raw).hexdigest() != CADDY_SHA512:
              raise ValueError('Proxy fixture checksum mismatch.')
          binary = Path(os.environ['DEVOPTION_TEST_CADDY'])
          binary.parent.mkdir(mode=0o700)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              binary.write_bytes(archive.extractfile('caddy').read())
          binary.chmod(0o700)
          PYTHON
          cargo test -p devoption-cli --test server --release --locked --offline public_https_proxy -- --ignored --nocapture
      - name: Assemble and inspect the exact release executable
        env:
          BUNDLE_OUTPUT: ${{ runner.temp }}/devoption-bundle-candidate
        run: |
          python3 scripts/release_bundle.py --binary target/release/devoption --runtime target/release/devoption-runtime --output "$BUNDLE_OUTPUT"
          python3 scripts/check_release_bundle.py "$BUNDLE_OUTPUT" --binary target/release/devoption --runtime target/release/devoption-runtime
          python3 scripts/check_bundle_installer.py "$BUNDLE_OUTPUT"
      - name: Serve the public WASIp2 fixture with the packaged app worker
        env:
          BUNDLE_OUTPUT: ${{ runner.temp }}/devoption-bundle-candidate
        run: |
          rustup target add wasm32-wasip2
          cargo fetch --manifest-path examples/web-app/Cargo.toml --locked
          cargo build --manifest-path examples/web-app/Cargo.toml --release --target wasm32-wasip2 --locked --offline --target-dir "$RUNNER_TEMP/worker-smoke"
          python3 scripts/check_bundle_runtime.py "$BUNDLE_OUTPUT" --binary target/release/devoption --runtime target/release/devoption-runtime --component "$RUNNER_TEMP/worker-smoke/wasm32-wasip2/release/devoption_web_fixture.wasm"
      - name: Build and serve a named app with embedded assets on the disposable runner
        run: python3 scripts/check_named_web_app.py --disposable-system-host --runtime target/release/devoption-runtime
      - name: Exercise prior-preview upgrade and full-state recovery on disposable runner
        env:
          UPGRADE_FIXTURE: ${{ runner.temp }}/devoption-upgrade-fixture
        run: |
          python3 scripts/check_bundle_upgrade.py --prepare "$UPGRADE_FIXTURE"
          sudo env DEVOPTION_DISPOSABLE_UPGRADE_FIXTURE=1 python3 scripts/check_bundle_upgrade.py --disposable-system-host "$UPGRADE_FIXTURE"
      - name: Reboot upgraded, interrupted and recovered installations in private QEMU guest
        env:
          UPGRADE_FIXTURE: ${{ runner.temp }}/devoption-upgrade-fixture
          REBOOT_REPORT: ${{ runner.temp }}/devoption-upgrade-reboot.json
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso
          if [ -e /dev/kvm ]; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          python3 scripts/check_upgrade_reboot.py --fixtures "$UPGRADE_FIXTURE" --report "$REBOOT_REPORT"
      - run: git diff --exit-code

  scripts:
    name: Python and Node checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit committed candidate identities
        run: python3 scripts/release_candidates.py audit
      - name: Install pinned Rust components for release fixtures
        run: rustup show active-toolchain
      - uses: ./.github/actions/install-release-plz
      - uses: ./.github/actions/install-attestation-gh
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
        env:
          DEVOPTION_RELEASE_PLZ: ${{ runner.temp }}/release-plz-tool/release-plz
          DEVOPTION_ATTEST_GH: ${{ runner.temp }}/attestation-gh/bin/gh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - run: node --test scripts/test_*.cjs
      - run: git diff --exit-code

  checks:
    # Preserve the required status; skipped or failed dependencies must fail it.
    name: Rust and repository checks
    needs: [lint, tests, installation, scripts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          if len(results) != 4 or any(result != "success" for result in results):
              raise SystemExit(f"Validation jobs did not all pass: {results}")
          PYTHON

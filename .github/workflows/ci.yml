name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      full-validation:
        description: 'Require installation acceptance for reusable release checks'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Select installation coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      installation: ${{ steps.select.outputs.installation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select conservative PR coverage
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.full-validation }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_installation.py select

  lint:
    name: Rust formatting and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup show active-toolchain
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: git diff --exit-code

  tests:
    name: Rust tests and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup show active-toolchain
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked --offline
      - name: Build trusted fixture from verified local registry seed
        run: cargo test -p devoption-registry --test offline_build --locked --offline -- --ignored --nocapture
      - run: cargo build --workspace --locked --offline
      - run: git diff --exit-code

  installation:
    needs: selection
    if: needs.selection.outputs.installation == 'true'
    name: Release build and installation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup show active-toolchain
      - run: cargo fetch --locked
      - name: Check private source-install fixtures
        run: |
          cargo build --workspace --release --locked --offline
          cargo test -p devoption-cli --test server --release --locked --offline installation
          python3 scripts/check_systemd_unit.py target/release/devoption
      - name: Verify ordinary and protected HTTPS access through the pinned proxy
        env:
          DEVOPTION_TEST_CADDY: ${{ runner.temp }}/devoption-proxy-test/caddy
        run: |
          python3 - <<'PYTHON'
          import hashlib, io, os, sys, tarfile, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from release_bundle import CADDY_SHA512, CADDY_VERSION
          url = f'https://github.com/caddyserver/caddy/releases/download/v{CADDY_VERSION}/caddy_{CADDY_VERSION}_linux_amd64.tar.gz'
          with urllib.request.urlopen(url, timeout=30) as response:
              raw = response.read(256 * 1024 * 1024 + 1)
          if hashlib.sha512(raw).hexdigest() != CADDY_SHA512:
              raise ValueError('Proxy fixture checksum mismatch.')
          binary = Path(os.environ['DEVOPTION_TEST_CADDY'])
          binary.parent.mkdir(mode=0o700)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              binary.write_bytes(archive.extractfile('caddy').read())
          binary.chmod(0o700)
          PYTHON
          cargo test -p devoption-cli --test server --release --locked --offline public_https_proxy -- --ignored --nocapture
      - name: Assemble and inspect the exact release executable
        env:
          BUNDLE_OUTPUT: ${{ runner.temp }}/devoption-bundle-candidate
        run: |
          python3 scripts/release_bundle.py --binary target/release/devoption --runtime target/release/devoption-runtime --output "$BUNDLE_OUTPUT"
          python3 scripts/check_release_bundle.py "$BUNDLE_OUTPUT" --binary target/release/devoption --runtime target/release/devoption-runtime
          python3 scripts/check_bundle_installer.py "$BUNDLE_OUTPUT"
      - name: Serve the public WASIp2 fixture with the packaged app worker
        env:
          BUNDLE_OUTPUT: ${{ runner.temp }}/devoption-bundle-candidate
        run: |
          rustup target add wasm32-wasip2
          cargo fetch --manifest-path examples/web-app/Cargo.toml --locked
          cargo build --manifest-path examples/web-app/Cargo.toml --release --target wasm32-wasip2 --locked --offline --target-dir "$RUNNER_TEMP/worker-smoke"
          python3 scripts/check_bundle_runtime.py "$BUNDLE_OUTPUT" --binary target/release/devoption --runtime target/release/devoption-runtime --component "$RUNNER_TEMP/worker-smoke/wasm32-wasip2/release/devoption_web_fixture.wasm"
      - name: Build and serve a named app with embedded assets on the disposable runner
        run: python3 scripts/check_named_web_app.py --disposable-system-host --runtime target/release/devoption-runtime
      - name: Prove scoped record writes with disposable Unix-only PostgreSQL
        run: |
          PG_PROOF_ROOT="$RUNNER_TEMP/app-records-postgres"
          mkdir -p "$PG_PROOF_ROOT/source"
          curl --fail --location --silent --show-error https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2 -o "$PG_PROOF_ROOT/source.tar.bz2"
          echo "555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f  $PG_PROOF_ROOT/source.tar.bz2" | sha256sum --check
          tar -xf "$PG_PROOF_ROOT/source.tar.bz2" -C "$PG_PROOF_ROOT/source" --strip-components=1
          (
            cd "$PG_PROOF_ROOT/source"
            ./configure --prefix="$PG_PROOF_ROOT/installed" --without-icu --without-readline --without-zlib > "$PG_PROOF_ROOT/configure.log"
            make -j2 > "$PG_PROOF_ROOT/build.log"
            make install > "$PG_PROOF_ROOT/install.log"
          )
          cargo fetch --manifest-path examples/https-app/Cargo.toml --locked
          cargo build --manifest-path examples/https-app/Cargo.toml --release --target wasm32-wasip2 --locked --offline --target-dir "$RUNNER_TEMP/https-smoke"
          python3 scripts/check_app_https.py --release --component "$RUNNER_TEMP/https-smoke/wasm32-wasip2/release/devoption_https_fixture.wasm"
          cargo fetch --manifest-path examples/record-app/Cargo.toml --locked
          cargo build --manifest-path examples/record-app/Cargo.toml --release --target wasm32-wasip2 --locked --offline --target-dir "$RUNNER_TEMP/record-smoke"
          python3 scripts/check_app_records.py --pg-bin "$PG_PROOF_ROOT/installed/bin" --worker target/release/devoption-runtime --component "$RUNNER_TEMP/record-smoke/wasm32-wasip2/release/devoption_record_fixture.wasm"
          test -x /usr/lib/postgresql/16/bin/postgres
          python3 scripts/check_app_records.py --pg-bin /usr/lib/postgresql/16/bin --worker target/release/devoption-runtime --component "$RUNNER_TEMP/record-smoke/wasm32-wasip2/release/devoption_record_fixture.wasm"
          python3 scripts/check_managed_records.py --disposable-system-host --pg-bin /usr/lib/postgresql/16/bin --worker target/release/devoption-runtime --component "$RUNNER_TEMP/record-smoke/wasm32-wasip2/release/devoption_record_fixture.wasm" --stateless-component "$RUNNER_TEMP/worker-smoke/wasm32-wasip2/release/devoption_web_fixture.wasm" --https-component "$RUNNER_TEMP/https-smoke/wasm32-wasip2/release/devoption_https_fixture.wasm"
      - name: Exercise prior-preview upgrade and full-state recovery on disposable runner
        env:
          UPGRADE_FIXTURE: ${{ runner.temp }}/devoption-upgrade-fixture
        run: |
          python3 scripts/check_bundle_upgrade.py --prepare "$UPGRADE_FIXTURE"
          sudo env DEVOPTION_DISPOSABLE_UPGRADE_FIXTURE=1 python3 scripts/check_bundle_upgrade.py --disposable-system-host "$UPGRADE_FIXTURE"
      - name: Reboot upgraded, interrupted and recovered installations in private QEMU guest
        env:
          UPGRADE_FIXTURE: ${{ runner.temp }}/devoption-upgrade-fixture
          REBOOT_REPORT: ${{ runner.temp }}/devoption-upgrade-reboot.json
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso
          if [ -e /dev/kvm ]; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          python3 scripts/check_upgrade_reboot.py --fixtures "$UPGRADE_FIXTURE" --report "$REBOOT_REPORT"
      - run: git diff --exit-code

  scripts:
    name: Python and Node checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit committed candidate identities
        run: python3 scripts/release_candidates.py audit
      - name: Install pinned Rust components for release fixtures
        run: rustup show active-toolchain
      - uses: ./.github/actions/install-release-plz
      - uses: ./.github/actions/install-attestation-gh
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
        env:
          DEVOPTION_RELEASE_PLZ: ${{ runner.temp }}/release-plz-tool/release-plz
          DEVOPTION_ATTEST_GH: ${{ runner.temp }}/attestation-gh/bin/gh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - run: node --test scripts/test_*.cjs
      - run: git diff --exit-code

  checks:
    # Accept installation skipping only after a successful explicit safe-change decision.
    name: Rust and repository checks
    needs: [selection, lint, tests, installation, scripts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected validation job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_installation.py gate

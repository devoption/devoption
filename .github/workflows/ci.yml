name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - run: cargo build --workspace --locked --offline
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - run: node --test scripts/test_appearance.cjs
      - run: git diff --exit-code

  contribution:
    name: Issue and change documentation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/check_pr.py
        env:
          GH_TOKEN: ${{ github.token }}

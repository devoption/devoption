name: Release preparation

on:
  workflow_dispatch:
    inputs:
      proposal_date:
        description: 'Proposal date, YYYY-MM-DD; reuse the same date when retrying'
        required: true
        type: string
      create_draft:
        description: 'Create or recover the identical bot-owned draft release PR after validation'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: platform-release-preparation
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  plan:
    name: Prepare an exact-revision proposal (no publication)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned release-plz
        uses: ./.github/actions/install-release-plz
      - name: Prepare offline inputs
        run: |
          rustup show active-toolchain
          cargo fetch --locked
      - name: Exercise release and no-release fixtures
        env:
          DEVOPTION_RELEASE_PLZ: ${{ runner.temp }}/release-plz-tool/release-plz
        run: python3 -m unittest discover -s scripts -p 'test_release_*.py'
      - name: Generate a disposable proposal
        env:
          PROPOSAL_DATE: ${{ inputs.proposal_date }}
        run: |
          python3 scripts/release_plan.py \
            --channel preview \
            --date "$PROPOSAL_DATE" \
            --release-plz "$RUNNER_TEMP/release-plz-tool/release-plz" \
            --output "$RUNNER_TEMP/release-proposal"
          {
            echo '## Release preparation proposal'
            echo 'No PR, tag, release, or publication was created. Review under #260 and #21.'
            echo '```json'
            cat "$RUNNER_TEMP/release-proposal/report.json"
            echo '```'
            echo '<details><summary>Proposed version and changelog diff</summary>'
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/release-proposal/proposal.patch"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: git diff --exit-code

  draft:
    name: Create an immutable draft release PR
    needs: [checks, plan]
    if: inputs.create_draft && github.ref == 'refs/heads/main' && github.repository == 'devoption/devoption'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-release-plz
      - name: Prepare offline inputs
        run: |
          rustup show active-toolchain
          cargo fetch --locked
      - name: Regenerate and create or recover the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATE_DRAFT: ${{ inputs.create_draft }}
          RELEASE_CHECKS_RESULT: ${{ needs.checks.result }}
          RELEASE_PLAN_RESULT: ${{ needs.plan.result }}
          PROPOSAL_DATE: ${{ inputs.proposal_date }}
        run: |
          python3 scripts/release_pr.py \
            --release-plz "$RUNNER_TEMP/release-plz-tool/release-plz" \
            --date "$PROPOSAL_DATE" >> "$GITHUB_STEP_SUMMARY"
      - run: git diff --exit-code

name: Install pinned release-plz
description: Verify the fixed Ubuntu archive before extracting the preparation tool
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl --fail --silent --show-error --location \
          https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.172/release-plz-x86_64-unknown-linux-gnu.tar.gz \
          --output "$RUNNER_TEMP/release-plz.tar.gz"
        echo "84b7013d164e1fc780b31dc9ef190977830599d6cb5ce81c993f6fcbd3cdc1aa  $RUNNER_TEMP/release-plz.tar.gz" | sha256sum --check
        mkdir "$RUNNER_TEMP/release-plz-tool"
        tar -xzf "$RUNNER_TEMP/release-plz.tar.gz" -C "$RUNNER_TEMP/release-plz-tool"
